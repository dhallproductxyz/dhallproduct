<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Daniel Hall</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333;
            --heading-color: #111;
            --accent-color: #0056b3;
            --btn-bg: #f0f0f0;
            --btn-hover: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --heading-color: #ffffff;
            --accent-color: #4da3ff;
            --btn-bg: #333333;
            --btn-hover: #444444;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            max-width: 750px;
            margin: 0 auto;
            padding: 2rem;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            padding-top: 20vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        h1 { color: var(--heading-color); font-size: 2.5rem; margin-bottom: 0.5rem; }
        p { font-size: 1.25rem; }
        .btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.5rem 1rem;
            background-color: var(--btn-bg);
            color: var(--text-color);
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
        }
        .btn:hover { background-color: var(--btn-hover); }
    </style>
</head>
<body>

    <h1>Message Sent!</h1>
    <p>Thanks for reaching out. I will get back to you as soon as possible.</p>
    <a href="index.html" class="btn">&larr; Back to Portfolio</a>

    <script>
        // Carries over the user's dark mode preference to this page
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
